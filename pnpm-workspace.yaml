packages:
  - packages/*
  - packages/*/benchmarks
  - examples/*
  - tools/benchmarking
  - tools/ppx/*
  - tools/weft_vite_plugin
  # weft_vite_plugin's fixture apps: ReScript packages, compiled by the root build.
  - tools/weft_vite_plugin/tests/fixtures/*

allowBuilds:
  esbuild: true

catalogs:
  default:
    '@changesets/changelog-github': ^1.0.1
    '@changesets/cli': ^3.0.3
    '@types/node': ^26.6.5
    tsx: ^4.23.15
    typescript: ^7.0.2
    terser: ^5.51.2
    mitata: ^1.0.34
    vite: npm:@voidzero-dev/vite-plus-core@1.3.0
    vite-plus: 1.3.0
    rescript: ^12.3.1
    '@rescript/runtime': ^12.3.1
    '@rescript/react': ^0.15.0
    'rescript-webapi': ^0.10.0
    '@rescript/webapi': 0.1.0-experimental-0781ac8
    hono: ^4.13.13
    '@hono/node-server': ^2.1.5
    'rescript-vitest': ^3.0.1
    jsdom: ^30.1.3
    '@playwright/test': 1.64.1
    '@axe-core/playwright': ^4.14.0
    react: ^19.3.1
    react-dom: ^19.3.1
    '@types/react': ^19.3.0
    '@types/react-dom': ^19.3.0

# Vite+ ships its own Vite build. Without the override, packages that depend
# on `vite` (e.g. through `rescript-vitest`) pull in a second, upstream copy.
minimumReleaseAgeExclude:
  - '@e-cline/js_env@0.0.1 || 0.0.2'
overrides:
  vite: 'catalog:'
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: '*'
