<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>res_fiber todos</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 32rem;
        margin: 2rem auto;
        padding: 0 1rem;
      }
      input#new-todo {
        width: 100%;
        font-size: 1.1rem;
        padding: 0.5rem;
        box-sizing: border-box;
      }
      ul {
        list-style: none;
        padding: 0;
      }
      li {
        display: flex;
        gap: 0.5rem;
        align-items: center;
        padding: 0.25rem 0;
      }
      li.done span {
        text-decoration: line-through;
        opacity: 0.6;
      }
      li button {
        margin-left: auto;
      }
      footer {
        display: flex;
        gap: 1rem;
        align-items: center;
      }
      nav button[aria-pressed='true'] {
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/Main.res.js"></script>
  </body>
</html>
