version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # Vite+ pins `vite` to its own build (see pnpm-workspace.yaml), so the
      # two move together.
      vite-plus:
        patterns: ['vite', 'vite-plus']
      rescript:
        patterns: ['rescript', '@rescript/*', 'rescript-*']
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
