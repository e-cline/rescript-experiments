name: Set up opam
description: >-
  Installs opam and restores the cached OCaml toolchain the workspace's ReScript
  PPXs are built with.

# The workspace compiles ReScript PPXs written in OCaml (tools/ppx/*) before
# any ReScript, so building or testing needs opam. The root `ppx:setup` task
# (tools/ppx/setup.sh) creates a global opam switch named `rescript_ppx` from
# the lock file, which compiles OCaml and takes several minutes, so opam's
# root -- the switch included -- is cached until the lock file changes. The
# switch lives in ~/.opam rather than the checkout, so the key doesn't depend
# on where the repository is checked out (or what it's called). setup.sh is
# part of the key too: it decides what the switch is called and how it's
# built, and an exact cache hit is never saved again, so a restored ~/.opam
# missing the switch it now expects would be rebuilt on every run.
runs:
  using: composite
  steps:
    - name: Install opam
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install --yes opam
    - name: Cache the OCaml toolchain
      id: opam-cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.opam
        key:
          opam-${{ runner.os }}-${{ runner.arch }}-${{
          hashFiles('tools/ppx/rescript_ppx.opam.locked', 'tools/ppx/setup.sh')
          }}
    - name: Initialize opam
      if: steps.opam-cache.outputs.cache-hit != 'true'
      shell: bash
      run: opam init --bare --disable-sandboxing --no-setup --yes
