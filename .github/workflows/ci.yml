name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Check, build and test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Installs Vite+, Node and pnpm, then runs `vp install`.
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          node-version: ${{ matrix.node }}
          cache: true

      # The OCaml toolchain the workspace's ReScript PPXs are built with.
      - uses: ./.github/actions/setup-opam

      # `vp run` loads every package's Vite config to make its task graph, and
      # the examples' configs import the Vite plugin from its build (`dist`,
      # not committed): build it first, with `vp pack`, which doesn't.
      - run: vp pack
        working-directory: tools/weft_vite_plugin

      # The check type-checks TypeScript that imports files the ReScript
      # compiler generates, so it has to follow the build.
      - run: vp run build
      # The ReScript compiler's output is committed (see .gitignore): fail if
      # the build changed it, or wrote output for a file that has none yet.
      - name: Check the committed ReScript output is up to date
        run: |
          git add --intent-to-add -- '*.res.js' '*.res.jsx'
          git diff --exit-code --stat -- '*.res.js' '*.res.jsx'
      - run: vp run check
      - run: vp run test

  e2e:
    # The browser tests (examples/weft_notes/e2e and examples/weft_shop/e2e), against the built apps
    # in Chromium, on one Node version. Everything a browser isn't needed for is tested in the job
    # above.
    name: Browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          node-version: '24'
          cache: true

      - uses: ./.github/actions/setup-opam

      # `vp run` loads every package's Vite config to make its task graph, and
      # the examples' configs import the Vite plugin from its build (`dist`,
      # not committed): build it first, with `vp pack`, which doesn't.
      - run: vp pack
        working-directory: tools/weft_vite_plugin
      - run: vp run build
      - name: Install Chromium for Playwright
        run:
          pnpm --filter @e-cline/weft_notes_example exec playwright install
          --with-deps chromium
      - run: vp run --filter @e-cline/weft_notes_example e2e
      - run: vp run --filter @e-cline/weft_shop_example e2e
